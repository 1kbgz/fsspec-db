[package]
name = "fsspec_db_py"
version = "0.4.1"
edition = "2021"
publish = false

[lib]
name = "fsspec_db"
path = "rust/python/lib.rs"
crate-type = ["cdylib"]

[dependencies]
fsspec_db = { path = "./rust", version = "*" }
fsspec_rs = "0.2.1"
fsspec_sys = { version = "0.2.1", optional = true }
pyo3 = { version = "0.30.1", features = ["abi3", "extension-module", "multiple-pymethods"] }

[features]
default = ["capi"]
# Register in the shared libfsspec; `direct` keeps a registry inside this extension (Pyodide).
capi = ["dep:fsspec_sys"]
direct = []

[profile.release]
panic = 'abort'
lto = true
